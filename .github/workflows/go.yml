name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    # Fails if the go-enum generated methods are stale (same as
    # ./run-go-enum.sh -validate).
    - name: Validate go-enum methods
      run: go tool -modfile=tools/go.mod go-enum -validate ./...

    - name: Test
      run: go test -count=1 -race -v ./...
